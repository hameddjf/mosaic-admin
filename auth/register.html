<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام | Mosaic Admin</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">

<div class="login-screen">
  <button class="icon-btn" onclick="toggleLang()" id="lang-btn" style="position:absolute; top:20px; left:20px; font-family:var(--font-mono); font-size:11px; font-weight:700;">EN</button>
  <button class="icon-btn" onclick="toggleBrand()" id="brand-btn" title="رنگ: دلتیز" style="position:absolute; top:20px; left:68px;">◆</button>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" style="width:46px;height:46px;"></div>
      <div class="login-title">ساخت حساب کاربری</div>
      <div class="login-sub">برای شروع، اطلاعات زیر را تکمیل کنید</div>
    </div>
    <form id="register-form">
      <div class="field">
        <label>نام و نام خانوادگی</label>
        <input type="text" placeholder="مثلاً سارا احمدی" required>
      </div>
      <div class="field">
        <label>ایمیل</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" placeholder="حداقل ۸ کاراکتر" required>
      </div>
      <div class="field">
        <label>تکرار رمز عبور</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div style="margin:2px 0 20px; font-size:11.5px; color:var(--fg-low); display:flex; align-items:center; gap:6px;">
        <input type="checkbox" style="width:auto;" required>
        <span>با <a href="#" style="color:var(--accent); text-decoration:none;">قوانین و مقررات</a> موافقم</span>
      </div>
      <button type="submit" class="btn-primary" style="width:100%; padding:11px;">ایجاد حساب</button>
    </form>
    <div style="text-align:center; font-size:12.5px; color:var(--fg-low); margin-top:20px;">
      قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html" style="color:var(--accent); text-decoration:none;">ورود</a>
    </div>
  </div>
</div>

<script src="../js/script.js"></script>
<script>
  const registerForm = document.getElementById('register-form');
  if(registerForm){
    registerForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const pass = registerForm.querySelectorAll('input[type="password"]');
      if(pass[0].value !== pass[1].value){
        showToast('رمز عبور و تکرار آن یکسان نیستند', 'danger');
        return;
      }
      showToast('حساب کاربری ایجاد شد', 'success');
      setTimeout(()=> window.location.href = 'verify-email.html', 500);
    });
  }
</script>
</body>
</html>
