<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغییر رمز عبور | Mosaic Admin</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">

<div class="login-screen">
  <button class="icon-btn" onclick="toggleLang()" id="lang-btn" style="position:absolute; top:20px; left:20px; font-family:var(--font-mono); font-size:11px; font-weight:700;">EN</button>
  <button class="icon-btn" onclick="toggleBrand()" id="brand-btn" title="رنگ: دلتیز" style="position:absolute; top:20px; left:68px;">◆</button>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" style="width:46px;height:46px;"></div>
      <div class="login-title">تعیین رمز عبور جدید</div>
      <div class="login-sub">رمز عبور جدید باید حداقل ۸ کاراکتر باشد</div>
    </div>
    <form id="reset-form">
      <div class="field">
        <label>رمز عبور جدید</label>
        <input type="password" id="new-pass" placeholder="••••••••" required>
      </div>
      <div class="strength-meter">
        <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
      </div>
      <div class="field">
        <label>تکرار رمز عبور جدید</label>
        <input type="password" id="new-pass-confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%; padding:11px; margin-top:6px;">ذخیره رمز عبور</button>
    </form>
  </div>
</div>

<script src="../js/script.js"></script>
<script>
  const newPass = document.getElementById('new-pass');
  const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
  newPass.addEventListener('input', ()=>{
    const v = newPass.value;
    let score = 0;
    if(v.length >= 8) score++;
    if(/[A-Z]/.test(v)) score++;
    if(/[0-9]/.test(v)) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;
    bars.forEach((b,i)=> b.classList.toggle('on', i < score));
  });

  const resetForm = document.getElementById('reset-form');
  resetForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const p1 = document.getElementById('new-pass').value;
    const p2 = document.getElementById('new-pass-confirm').value;
    if(p1.length < 8){
      showToast('رمز عبور باید حداقل ۸ کاراکتر باشد', 'danger');
      return;
    }
    if(p1 !== p2){
      showToast('رمز عبور و تکرار آن یکسان نیستند', 'danger');
      return;
    }
    showToast('رمز عبور با موفقیت تغییر کرد', 'success');
    setTimeout(()=> window.location.href = 'login.html', 700);
  });
</script>
</body>
</html>
