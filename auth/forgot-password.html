<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فراموشی رمز عبور | Mosaic Admin</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">

<div class="login-screen">
  <button class="icon-btn" onclick="toggleLang()" id="lang-btn" style="position:absolute; top:20px; left:20px; font-family:var(--font-mono); font-size:11px; font-weight:700;">EN</button>
  <button class="icon-btn" onclick="toggleBrand()" id="brand-btn" title="رنگ: دلتیز" style="position:absolute; top:20px; left:68px;">◆</button>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" style="width:46px;height:46px;"></div>
      <div class="login-title">بازیابی رمز عبور</div>
      <div class="login-sub">ایمیل حساب کاربری خود را وارد کنید تا کد بازیابی برای شما ارسال شود</div>
    </div>
    <form id="forgot-form">
      <div class="field">
        <label>ایمیل</label>
        <input type="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%; padding:11px;">ارسال کد بازیابی</button>
    </form>
    <div style="text-align:center; font-size:12.5px; color:var(--fg-low); margin-top:20px;">
      رمز عبورتان را به خاطر آوردید؟ <a href="login.html" style="color:var(--accent); text-decoration:none;">بازگشت به ورود</a>
    </div>
  </div>
</div>

<script src="../js/script.js"></script>
<script>
  const forgotForm = document.getElementById('forgot-form');
  if(forgotForm){
    forgotForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      showToast('کد بازیابی ارسال شد', 'success');
      setTimeout(()=> window.location.href = 'verify-reset-code.html', 500);
    });
  }
</script>
</body>
</html>
